name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: queryhub
          POSTGRES_PASSWORD: queryhub
          POSTGRES_DB: queryhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queryhub -d queryhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://queryhub:queryhub@localhost:5432/queryhub?schema=public
      DIRECT_URL: postgresql://queryhub:queryhub@localhost:5432/queryhub?schema=public
      DATABASE_ADAPTER: native
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      EMAIL_PROVIDER: log
      EMAIL_FROM: QueryHub CI <noreply@example.com>
      RATE_LIMIT_PROVIDER: memory
      TRUST_PROXY: "false"
      STORAGE_PROVIDER: local
      MAX_UPLOAD_BYTES: "5242880"
      READINESS_TOKEN: ci-readiness-token-with-sufficient-length
      LOG_LEVEL: warn
      MONITORING_PROVIDER: log
      RUN_DATABASE_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check env + prisma
        run: |
          npm run env:validate
          npx prisma validate

      - name: Secret scan
        run: npm run security:check

      - name: DB migrate + seed
        run: |
          npm run db:deploy
          npm run db:seed

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: npm audit
        run: npm audit --audit-level=moderate --omit=dev

      - name: Build
        run: npm run build

      - name: Client secret scan
        run: npm run security:client

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload e2e artifacts if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
