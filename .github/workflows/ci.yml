name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: queryhub
          POSTGRES_PASSWORD: queryhub
          POSTGRES_DB: queryhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queryhub -d queryhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://queryhub:queryhub@localhost:5432/queryhub?schema=public
      DIRECT_URL: postgresql://queryhub:queryhub@localhost:5432/queryhub?schema=public
      DATABASE_ADAPTER: native
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      EMAIL_PROVIDER: log
      EMAIL_FROM: QueryHub CI <noreply@example.com>
      RATE_LIMIT_PROVIDER: memory
      TRUST_PROXY: "false"
      STORAGE_PROVIDER: local
      MAX_UPLOAD_BYTES: "5242880"
      READINESS_TOKEN: ci-readiness-token-with-sufficient-length
      LOG_LEVEL: warn
      MONITORING_PROVIDER: log
      RUN_DATABASE_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate environment and Prisma schema
        run: |
          npm run env:validate
          npx prisma validate

      - name: Scan tracked files for secrets
        run: npm run security:check

      - name: Apply production migrations and seed CI fixtures
        run: |
          npm run db:deploy
          npm run db:seed

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and PostgreSQL integration tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --audit-level=moderate

      - name: Build production application
        run: npm run build

      - name: Scan browser bundle for server secrets
        run: npm run security:client

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
