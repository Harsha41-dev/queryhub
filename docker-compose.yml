services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: queryhub
      POSTGRES_PASSWORD: queryhub
      POSTGRES_DB: queryhub
    ports:
      - "5432:5432"
    volumes:
      - queryhub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queryhub -d queryhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  queryhub_postgres:
